name: security-quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic assessment
        run: python -m src.cli --events data/synthetic_events.json --identity-context data/identity_context.json --output /tmp/credential-access-assessment.md
      - name: Validate expected report content
        run: |
          grep -q "Credential Access Assessment" /tmp/credential-access-assessment.md
          grep -q "T1003.001" /tmp/credential-access-assessment.md
